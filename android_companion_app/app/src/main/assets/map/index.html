<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Journey Map</title>
  <style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  height: 100%;
  background: #e2e7dc;
  color: #242820;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  user-select: none;
  -webkit-user-select: none;
  overflow: hidden;
}

.map-card {
  padding: 8px 10px 8px;
  background: #e2e7dc;
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
}

.map-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
  flex-wrap: nowrap;
  gap: 4px;
}

.title-block {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.eyebrow {
  color: #5d675b;
  font-size: 9px;
  font-family: monospace;
  letter-spacing: 0.1em;
  font-weight: 700;
}

.title-block strong {
  font-size: 13px;
  color: #242820;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.map-actions {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}

.map-actions button {
  min-width: 28px;
  height: 28px;
  border: 1px solid #c3cec0;
  color: #405449;
  background: #f7f8f0;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0 6px;
  touch-action: manipulation;
}

.map-actions button:active {
  background: #e4e8dd;
}

.map-actions .play {
  padding: 0 10px;
  color: #f8f6ef;
  background: #405b4a;
  border-color: #405b4a;
}

.map-actions .play span {
  margin-left: 3px;
  font-size: 11px;
}

.map-wrap {
  flex: 1;
  min-height: 100px;
  overflow: hidden;
  background: #dce6d8;
  border-radius: 6px;
  border: 1px solid #cdd7c8;
  position: relative;
  touch-action: none;
  display: flex;
  align-items: center;
  justify-content: center;
}

#map-svg {
  display: block;
  width: 100%;
  height: 100%;
  max-height: 100%;
  cursor: grab;
}

#map-svg:active {
  cursor: grabbing;
}

.ocean { fill: #dce6d8; }
.land { fill: #f5f2e9; stroke: #b7c5b4; stroke-width: 0.5; }
.graticule { fill: none; stroke: #b6c8b3; stroke-opacity: 0.55; stroke-width: 0.5; }

.timeline {
  display: block;
  width: 100%;
  margin-top: 6px;
  accent-color: #405b4a;
  height: 18px;
}

.timeline-labels {
  display: flex;
  justify-content: space-between;
  color: #687363;
  font-size: 9px;
  font-family: monospace;
  margin-top: 2px;
}

  </style>
</head>

        <button id="btn-restart" title="Restart journey">&#8634;</button>

        <button id="btn-zoom-out" title="Zoom out">&minus;</button>
        <button id="btn-fit" title="Fit route to view">&#x26F6; Fit</button>
        <button id="btn-reset" title="World overview">&#127757;</button>
      </div>
    </div>
